name: Option planner

# Run from GitHub: Actions tab -> "Option planner" -> Run workflow.
# Results appear on the run's Summary page.
on:
  workflow_dispatch:
    inputs:
      spot:
        description: "NIFTY spot (live)"
        required: true
        default: "22600"
      vix:
        description: "India VIX (live)"
        required: true
        default: "14.5"
      expiry:
        description: "Expiry date YYYY-MM-DD"
        required: true
        default: "2026-10-06"
      entry:
        description: "Entry time 'YYYY-MM-DD HH:MM' IST (blank = now)"
        required: false
        default: ""
      capital:
        description: "Trading capital in Rs"
        required: true
        default: "500000"
      risk_pct:
        description: "Max % of capital at risk per trade"
        required: true
        default: "2"
      directional_delta:
        description: "Short-strike delta for credit spreads"
        required: true
        default: "0.28"
      neutral_delta:
        description: "Short-strike delta for iron condor"
        required: true
        default: "0.15"
      widths:
        description: "Spread widths to test (comma separated)"
        required: true
        default: "100,150"
      chain_file:
        description: "Optional: path of a chain CSV committed to the repo (strike,type,bid,ask)"
        required: false
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/requirements.txt
      - run: pip install -r requirements.txt
      - name: Self-test
        run: python3 validate.py
      - name: Run planner
        env:
          SPOT: ${{ inputs.spot }}
          VIX: ${{ inputs.vix }}
          EXPIRY: ${{ inputs.expiry }}
          ENTRY: ${{ inputs.entry }}
          CAPITAL: ${{ inputs.capital }}
          RISK: ${{ inputs.risk_pct }}
          DDELTA: ${{ inputs.directional_delta }}
          NDELTA: ${{ inputs.neutral_delta }}
          WIDTHS: ${{ inputs.widths }}
          CHAIN: ${{ inputs.chain_file }}
        run: |
          set -o pipefail
          [ -z "$ENTRY" ] && ENTRY="$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M')"
          args=(--spot "$SPOT" --vix "$VIX" --entry "$ENTRY" --expiry "$EXPIRY"
                --capital "$CAPITAL" --risk-pct "$RISK" --directional-delta "$DDELTA"
                --neutral-delta "$NDELTA" --widths "$WIDTHS")
          [ -n "$CHAIN" ] && args+=(--chain "$GITHUB_WORKSPACE/$CHAIN")
          days=$(ENTRY="$ENTRY" python3 -c "import os; from datetime import datetime as d; f='%Y-%m-%d %H:%M'; print(round((d.strptime(os.environ['EXPIRY']+' 15:30', f) - d.strptime(os.environ['ENTRY'], f)).total_seconds()/86400, 2))")
          {
            echo "## Option planner: NIFTY $SPOT, VIX $VIX, expiry $EXPIRY"
            echo "Entry $ENTRY IST, capital Rs $CAPITAL, risk ${RISK}%"
            echo '```'
            python3 planner.py "${args[@]}"
            echo '```'
            echo "### Credit/width vs short-strike delta"
            echo '```'
            python3 sweep.py "$SPOT" "$VIX" "$days"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
