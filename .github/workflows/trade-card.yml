name: Daily trade card

# Fully automatic: fetches NIFTY spot, India VIX, history (Yahoo Finance) and the
# option chain (NSE live API, else NSE bhavcopy), applies the playbook rules and
# publishes a TRADE / NO TRADE card.
#  - Summary page of each run shows the card.
#  - Cards are saved in reports/.
#  - A GitHub issue is opened when the verdict is TRADE (GitHub app notifies you).
on:
  schedule:
    # Three chances inside the 10:00-11:30 IST entry window: GitHub delays or drops
    # scheduled runs under load, so one slot alone is not reliable.
    - cron: "35 4 * * 1-5"   # 10:05 IST, Mon-Fri
    - cron: "7 5 * * 1-5"    # 10:37 IST
    - cron: "35 5 * * 1-5"   # 11:05 IST
  workflow_dispatch:
    inputs:
      capital:
        description: "Trading capital in Rs"
        default: "500000"
      risk_pct:
        description: "Max % of capital at risk per trade"
        default: "2"
      expiry:
        description: "Expiry YYYY-MM-DD (blank = nearest valid weekly)"
        default: ""
      max_lots:
        description: "Max lots per trade (keep 1 for the first 8-10 trades)"
        default: "1"

permissions:
  contents: write
  issues: write

concurrency:
  group: trade-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/requirements.txt
      - run: pip install -r toolkit/requirements.txt
      - name: Build trade card
        working-directory: toolkit
        env:
          CAPITAL: ${{ inputs.capital || '500000' }}
          RISK: ${{ inputs.risk_pct || '2' }}
          EXPIRY: ${{ inputs.expiry || '' }}
          MAX_LOTS: ${{ inputs.max_lots || '1' }}
        run: |
          set -o pipefail
          python3 validate.py
          python3 auto.py --capital "$CAPITAL" --risk-pct "$RISK" --expiry "$EXPIRY" --max-lots "$MAX_LOTS" \
            --report-dir ../reports | tee card.md
          cat card.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -qm "Trade card $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST" || exit 0
          git pull -q --rebase && git push -q
      - name: Notify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Every run comments on one "Daily trade cards" issue, so each card
          # (TRADE or NO TRADE) reaches the GitHub app; a TRADE also gets its own issue.
          stamp="$(TZ=Asia/Kolkata date '+%a %d %b %H:%M') IST"
          verdict="$(grep -m1 '^\*\*' toolkit/card.md | tr -d '*')"
          { echo "### $stamp: $verdict"; echo; echo "[Full run]($RUN_URL)"; echo
            sed '/^<details>/,$d' toolkit/card.md | sed '1d'; } > comment.md
          num="$(gh issue list --state open --search 'Daily trade cards in:title' --json number,title \
                 --jq '.[] | select(.title == "Daily trade cards") | .number' | head -1)"
          if [ -z "$num" ]; then
            num="$(gh issue create --title "Daily trade cards" \
                   --body "Every trade-card run posts here. Subscribe to this issue to get each card on your phone." \
                   | grep -o '[0-9]*$')"
          fi
          gh issue comment "$num" --body-file comment.md
          if grep -q '^\*\*TRADE:' toolkit/card.md; then
            gh issue create --title "$verdict - $stamp" --body-file toolkit/card.md
          fi
