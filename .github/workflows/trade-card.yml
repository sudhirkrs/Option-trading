name: Daily trade card

# Fully automatic: fetches NIFTY spot, India VIX, history (Yahoo Finance) and the
# option chain (NSE live API, else NSE bhavcopy), applies the playbook rules and
# publishes a TRADE / NO TRADE card.
#  - Summary page of each run shows the card.
#  - Cards are saved in reports/.
#  - A GitHub issue is opened when the verdict is TRADE (GitHub app notifies you).
on:
  schedule:
    - cron: "35 4 * * 1-5"   # 10:05 IST, Mon-Fri (GitHub may start it a few minutes late)
    - cron: "5 6 * * 1-5"    # 11:35 IST second look
  workflow_dispatch:
    inputs:
      capital:
        description: "Trading capital in Rs"
        default: "500000"
      risk_pct:
        description: "Max % of capital at risk per trade"
        default: "2"
      expiry:
        description: "Expiry YYYY-MM-DD (blank = nearest valid weekly)"
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: trade-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/requirements.txt
      - run: pip install -r toolkit/requirements.txt
      - name: Build trade card
        working-directory: toolkit
        env:
          CAPITAL: ${{ inputs.capital || '500000' }}
          RISK: ${{ inputs.risk_pct || '2' }}
          EXPIRY: ${{ inputs.expiry || '' }}
        run: |
          set -o pipefail
          python3 validate.py
          python3 auto.py --capital "$CAPITAL" --risk-pct "$RISK" --expiry "$EXPIRY" \
            --report-dir ../reports | tee card.md
          cat card.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -qm "Trade card $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST" || exit 0
          git pull -q --rebase && git push -q
      - name: Notify on TRADE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '^\*\*TRADE:' toolkit/card.md; then
            title="$(grep -m1 '^\*\*TRADE:' toolkit/card.md | tr -d '*') - $(TZ=Asia/Kolkata date '+%d %b %H:%M') IST"
            gh issue create --title "$title" --body-file toolkit/card.md
          fi
