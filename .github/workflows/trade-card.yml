name: Daily trade card

# Fully automatic: fetches NIFTY spot, India VIX, history (Yahoo Finance) and the
# option chain (NSE live API, else NSE bhavcopy), applies the playbook rules and
# publishes a TRADE / NO TRADE card.
#  - Summary page of each run shows the card.
#  - Cards are saved in reports/.
#  - A GitHub issue is opened when the verdict is TRADE (GitHub app notifies you).
on:
  schedule:
    # GitHub starts scheduled runs on this repo 5-8 hours late (seen every day since
    # 30 Sep), so a run is requested every hour overnight. The first one that actually
    # starts between 04:30 and 10:05 IST waits until 10:05 IST, posts the card and
    # marks the day done; every other scheduled run that day exits in seconds.
    # A run that only starts after 10:05 IST still posts if it is before 11:30 IST.
    - cron: "17 19-23 * * 0-4"   # 00:47-04:47 IST Mon-Fri (19:17-23:17 UTC Sun-Thu)
    - cron: "17 0-5 * * 1-5"     # 05:47-10:47 IST Mon-Fri
  workflow_dispatch:
    inputs:
      capital:
        description: "Trading capital in Rs"
        default: "500000"
      risk_pct:
        description: "Max % of capital at risk per trade"
        default: "2"
      expiry:
        description: "Expiry YYYY-MM-DD (blank = nearest valid weekly)"
        default: ""
      max_lots:
        description: "Max lots per trade (keep 1 for the first 8-10 trades)"
        default: "1"
      source:
        description: "Who started this run (shown on the summary)"
        default: "GitHub Actions page"

permissions:
  contents: write
  issues: write

concurrency:
  # Scheduled runs queue behind each other (only one waits at a time); a manual run
  # is in its own group, so it never waits behind a sleeping scheduled run.
  group: trade-card-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/requirements.txt
      - run: pip install -r toolkit/requirements.txt
      - name: Wait for the entry window (scheduled runs only)
        id: win
        if: github.event_name == 'schedule'
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          skip() { echo "Skipping: $1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          git pull -q
          [ "$(cat reports/.scheduled-done 2>/dev/null)" = "$today" ] && skip "today's scheduled card already posted"
          python3 -c "import sys,datetime as d; sys.path.insert(0,'toolkit'); import marketdata as m; sys.exit(0 if m.is_trading_day(d.date.fromisoformat('$today')) else 1)" \
            || skip "$today is not an NSE trading day"
          now=$(TZ=Asia/Kolkata date +%H%M)
          [ "$now" -lt 0430 ] && skip "started at $now IST, too early to wait (a later run will take it)"
          [ "$now" -gt 1130 ] && skip "started at $now IST, after the 10:00-11:30 entry window"
          if [ "$now" -lt 1005 ]; then
            target=$(TZ=Asia/Kolkata date -d "$today 10:05" +%s)
            secs=$(( target - $(date +%s) ))
            echo "Started at $now IST; waiting $((secs / 60)) minutes until 10:05 IST."
            sleep "$secs"
          fi
          git pull -q
          [ "$(cat reports/.scheduled-done 2>/dev/null)" = "$today" ] && skip "another run posted while this one waited"
          echo "Building the card at $(TZ=Asia/Kolkata date +%H:%M) IST."
      - name: Build trade card
        if: steps.win.outputs.skip != 'true'
        working-directory: toolkit
        env:
          CAPITAL: ${{ inputs.capital || '500000' }}
          RISK: ${{ inputs.risk_pct || '2' }}
          EXPIRY: ${{ inputs.expiry || '' }}
          MAX_LOTS: ${{ inputs.max_lots || '1' }}
          SOURCE: ${{ inputs.source || 'GitHub schedule' }}
        run: |
          set -o pipefail
          python3 validate.py
          python3 auto.py --capital "$CAPITAL" --risk-pct "$RISK" --expiry "$EXPIRY" --max-lots "$MAX_LOTS" \
            --report-dir ../reports | tee card.md
          { echo "_Started by: ${SOURCE}_"; echo; cat card.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        if: steps.win.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          cp toolkit/card.md reports/LATEST.md
          if [ "${{ github.event_name }}" = "schedule" ]; then TZ=Asia/Kolkata date +%F > reports/.scheduled-done; fi
          git add reports
          git commit -qm "Trade card $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST" || exit 0
          git pull -q --rebase && git push -q
      - name: Notify
        if: steps.win.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Every run comments on one "Daily trade cards" issue, so each card
          # (TRADE or NO TRADE) reaches the GitHub app; a TRADE also gets its own issue.
          stamp="$(TZ=Asia/Kolkata date '+%a %d %b %H:%M') IST"
          verdict="$(grep -m1 '^\*\*' toolkit/card.md | tr -d '*')"
          { echo "### $stamp: $verdict"; echo; echo "@${{ github.repository_owner }}"; echo
            sed '/^<details>/,$d' toolkit/card.md | sed '1d'; echo; echo "[Full run]($RUN_URL)"; } > comment.md
          # The issue body always holds the latest card (comments below are the history).
          { echo "## Latest card: $stamp"; echo; echo "**$verdict**"; echo
            sed '/^<details>/,$d' toolkit/card.md | sed '1d'; echo; echo "---"
            echo "Older cards are in the comments below (oldest first) and in the reports/ folder."; } > body.md
          num="$(gh issue list --state open --search 'Daily trade cards in:title' --json number,title \
                 --jq '.[] | select(.title == "Daily trade cards") | .number' | head -1)"
          if [ -z "$num" ]; then
            num="$(gh issue create --title "Daily trade cards" \
                   --body "Every trade-card run posts here. Subscribe to this issue to get each card on your phone." \
                   | grep -o '[0-9]*$')"
          fi
          gh issue edit "$num" --body-file body.md
          gh issue comment "$num" --body-file comment.md
          if grep -q '^\*\*TRADE:' toolkit/card.md; then
            gh issue create --title "$verdict - $stamp" --body-file toolkit/card.md
          fi
